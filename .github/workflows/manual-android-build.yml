name: Manual APK Build (Launcher Safe Fix)
run-name: "Manual APK build · ${{ github.ref_name }} · #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manual-apk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: bash scripts/build_monolith_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-Manual-APK-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
