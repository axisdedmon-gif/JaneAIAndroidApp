name: Monolith AI Automated Build Engine
run-name: "Monolith AI · ${{ github.ref_name }} · CI #${{ github.run_number }}"

on:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: monolith-automated-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java JDK Environment
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Calculate Monolith Semantic Version
        id: parse_version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/calculate_monolith_version.sh

      - name: Inject Generated Version Into Android and BIOS Surfaces
        run: |
          python3 scripts/inject_monolith_ci_version.py
          python3 scripts/harden_bootstrap_diagnostics.py

      - name: Validate Runtime and Exclusive Scene Architecture
        run: |
          python3 scripts/strip_legacy_scene_overlays.py
          python3 scripts/validate_final_ui.py
          python3 -m py_compile \
            scripts/inject_monolith_ci_version.py \
            scripts/harden_bootstrap_diagnostics.py \
            scripts/strip_legacy_scene_overlays.py \
            scripts/validate_final_ui.py \
            scripts/validate_final_ui_apk.py
          bash -n scripts/calculate_monolith_version.sh
          bash -n scripts/build_monolith_apk.sh
          node --check app/src/main/assets/jane_command_deck.js
          node --check app/src/main/assets/jane_qol_runtime.js
          node --check app/src/main/assets/monolith_core.js
          node --check app/src/main/assets/monolith_scene_runtime.js
          node --check app/src/main/assets/monolith_voice_runtime_patch.js
          node --check app/src/main/assets/monolith_final_ui.js

          # Scene package + dedicated House Dedmon route + no hidden-WebView RAF deadlock.
          grep -q 'MONOLITH-SCENE-4' app/src/main/assets/monolith_scene_runtime.js
          grep -q '__monolithExclusiveRouter' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolith-launch' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'House Dedmon Access' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'house_dedmon_crest.webp' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolithEnterButton' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolith_landscape_gen2.css' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolith-scene-initializing' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolithSceneMounted' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolithLoadState' app/src/main/assets/monolith_scene_runtime.js
          grep -q '.monolith-launch-scene .dedmon-launch-shell' app/src/main/assets/monolith_scene_runtime.js
          if grep -Fq 'requestAnimationFrame(() => {' app/src/main/assets/monolith_scene_runtime.js && \
             grep -Fq 'document.documentElement.classList.remove("monolith-scene-initializing")' app/src/main/assets/monolith_scene_runtime.js; then
            python3 - <<'PYRAF'
from pathlib import Path
text = Path('app/src/main/assets/monolith_scene_runtime.js').read_text(encoding='utf-8')
deadlock = 'requestAnimationFrame(() => {\n      document.documentElement.classList.remove("monolith-scene-initializing")'
if deadlock in text:
    raise SystemExit('Launch visibility still depends on requestAnimationFrame while native WebView starts hidden.')
PYRAF
          fi
          grep -q '#home\[data-jane-scene="command"\]' app/src/main/assets/monolith_landscape_gen2.css
          grep -q '.dedmon-launch-shell' app/src/main/assets/monolith_landscape_gen2.css

          # Android must actually load that scene package before Monolith modules.
          grep -q 'monolith-scene-runtime-js' app/src/main/java/ai/monolith/app/MonolithActivity.java
          grep -q 'file:///android_asset/monolith_scene_runtime.js' app/src/main/java/ai/monolith/app/MonolithActivity.java
          grep -q 'verifySceneMount()' app/src/main/java/ai/monolith/app/MonolithActivity.java
          grep -q 'exclusive scene did not mount' app/src/main/java/ai/monolith/app/MonolithActivity.java
          grep -q 'MonolithCrashGuard.markStable(MonolithActivity.this)' app/src/main/java/ai/monolith/app/MonolithActivity.java

          grep -q 'MONOLITH-CORE-2' app/src/main/assets/monolith_core.js
          if grep -q 'ensureOverlay\|state\.overlay' app/src/main/assets/monolith_core.js; then
            echo 'Deprecated module overlay architecture survived in monolith_core.js.' >&2
            exit 1
          fi
          if grep -q 'House Dedmon Access' app/src/main/assets/index.html; then
            echo 'Legacy House Dedmon overlay survived in index.html; dedicated launch scene must own access UI.' >&2
            exit 1
          fi
          if grep -q '"72 BPM"\|"98.6°F"' app/src/main/assets/index.html; then
            echo 'Fake biometric telemetry survived scene cleanup.' >&2
            exit 1
          fi

          # Native BIOS + native Safe Base boundaries.
          grep -q 'android:name="ai.monolith.app.MonolithBootstrapActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name="ai.monolith.app.MonolithSafeBaseActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:targetActivity="ai.monolith.app.MonolithSafeBaseActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="sensorLandscape"' app/src/main/AndroidManifest.xml
          grep -q 'WebView.disableWebView();' app/src/main/java/ai/monolith/app/MonolithApplication.java
          grep -q 'disabled-safe-native' app/src/main/java/ai/monolith/app/MonolithApplication.java
          grep -q 'clearStartupState' app/src/main/java/ai/monolith/app/MonolithCrashGuard.java
          grep -q 'NATIVE RECOVERY CONSOLE // NO WEBVIEW' app/src/main/java/ai/monolith/app/MonolithSafeBaseActivity.java
          grep -q 'MONOLITH AI RUNTIME DIAGNOSTIC' app/src/main/java/ai/monolith/app/MonolithApplication.java
          grep -q 'DETERMINISTIC STARTUP BOUNDARY' app/src/main/java/ai/monolith/app/MonolithBootstrapActivity.java
          grep -q 'CORE BOOT LOCKED // CLEAR DIAGNOSTIC FIRST' app/src/main/java/ai/monolith/app/MonolithBootstrapActivity.java

          test -s app/src/main/assets/monolith_landscape_gen2.css
          test -s app/src/main/assets/house_dedmon_crest.webp
          test -s app/src/main/res/drawable/scifi_hardware_frame.xml
          test -s app/src/main/res/drawable/scifi_reactor_button.xml

      - name: Compile, Sign, Validate, and Package APK
        run: bash scripts/build_monolith_apk.sh

      - name: Validate Final UI Inside APK
        run: python3 scripts/validate_final_ui_apk.py

      - name: Publish Build Identity
        run: |
          {
            echo '### Monolith AI build identity'
            echo ''
            echo "- versionName: \`${VERSION_NAME}\`"
            echo "- versionCode: \`${VERSION_CODE}\`"
            echo "- Monolith generation: \`${MONOLITH_GEN}\`"
            echo "- UI generation: \`${UI_GEN}\`"
            echo "- patch: \`${PATCH_GEN}\`"
            echo '- launch flow: `BIOS -> House Dedmon Access -> Command Chamber`'
            echo '- Core readiness: `exclusive scene + synchronous visibility release`'
            echo '- Safe Base: `native recovery console / WebView disabled`'
            echo '- layout: `exclusive landscape scenes`'
            echo '- visual system: `cybernetic hard-sci-fi`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Installable APK Build Package
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-AI-Build-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
