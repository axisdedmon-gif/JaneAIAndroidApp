name: Flatten Jane V88 Repository

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jane-v88-flatten-once
  cancel-in-progress: false

jobs:
  flatten:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out patch-chain repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and validate completed V88
        run: bash scripts/build_v88_release.sh

      - name: Preserve validated V88 APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V88-true-offline-ai-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 14

      - name: Replace repository with flattened V88 source
        run: bash scripts/flatten_v88_repo.sh

      - name: Preserve flattened V88 source
        uses: actions/upload-artifact@v4
        with:
          name: JaneAIAndroidSource-v88-flattened
          path: JaneAIAndroidSource_v88_flattened.zip
          retention-days: 14
