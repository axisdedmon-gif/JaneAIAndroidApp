name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack Jane base package
        run: |
          rm -rf source unpacked
          mkdir -p unpacked

          if [ -f JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip ]; then
            unzip JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip -d source
          elif [ -f JaneV73LaunchRestoredHideVitalsOnlyPackage.zip ]; then
            unzip JaneV73LaunchRestoredHideVitalsOnlyPackage.zip -d unpacked
            unzip unpacked/JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip -d source
          else
            echo "Jane V73 base source package is missing."
            ls -la
            exit 1
          fi

      - name: Apply V76 reply and offline knowledge patch
        run: |
          cat > /tmp/v76.patch.gz.b64 <<'PATCH64'

PATCH64
          base64 -d /tmp/v76.patch.gz.b64 | gzip -d > /tmp/v76.patch
          cd source
          patch -p2 < /tmp/v76.patch

      - name: Verify exact V76 scope
        working-directory: source
        run: |
          echo "=== direct reply inside response screen ==="
          grep -q "v76-dialog-reply-knowledge-css" app/src/main/assets/index.html
          grep -q "dialogReplyComposer" app/src/main/assets/index.html
          grep -q "sendDialogReply" app/src/main/assets/index.html

          echo "=== primary offline knowledge engine ==="
          grep -q "v76-offline-knowledge-primary-engine" app/src/main/assets/index.html
          grep -q "UPLOADED OFFLINE KNOWLEDGE IS THE PRIMARY SOURCE" app/src/main/assets/index.html
          grep -q "JaneKnowledgeImportStart" app/src/main/assets/index.html
          grep -q "JaneKnowledgeImportChunk" app/src/main/assets/index.html
          grep -q "JaneKnowledgeImportComplete" app/src/main/assets/index.html
          grep -q "indexedDB.open" app/src/main/assets/index.html

          echo "=== native offline OCR and file extraction ==="
          grep -q "com.google.mlkit:text-recognition:16.0.1" app/build.gradle
          grep -q "PdfRenderer" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "TextRecognition.getClient" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "Intent.EXTRA_ALLOW_MULTIPLE" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "handleKnowledgePickerResult" app/src/main/java/com/example/janeai/MainActivity.java

          echo "=== retained untouched app systems ==="
          grep -q "V75_STARTUP_OBSERVER_FIX" app/src/main/assets/index.html
          grep -q "data:model/gltf-binary;base64," app/src/main/assets/index.html
          grep -q "v70-home-vitals-image3d-css" app/src/main/assets/index.html
          grep -q "v67b-transparent-webp-dialog-portrait-router" app/src/main/assets/index.html
          grep -q "rotation-per-second" app/src/main/assets/index.html
          grep -q "36deg" app/src/main/assets/index.html
          grep -q "playAssetVoice" app/src/main/java/com/example/janeai/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V76-reply-offline-knowledge-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
