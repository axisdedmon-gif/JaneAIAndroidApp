name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jane-android-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and validate V88
        run: bash scripts/build_v88_manual.sh

      - name: Upload signed V88 APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V88-true-offline-ai-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 1

      - name: Upload reproducible V88 source
        uses: actions/upload-artifact@v4
        with:
          name: JaneAIAndroidSource-v88-true-offline-ai
          path: JaneAIAndroidSource_v88_true_offline_ai.zip
          retention-days: 1
