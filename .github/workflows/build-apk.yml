name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack Jane V57 package
        run: |
          rm -rf source unpacked
          mkdir -p unpacked

          if [ -f JaneAIAndroidSource_v57_embedded_model_b.zip ]; then
            unzip JaneAIAndroidSource_v57_embedded_model_b.zip -d source
          elif [ -f JaneV57EmbeddedModelBPackage.zip ]; then
            unzip JaneV57EmbeddedModelBPackage.zip -d unpacked
            unzip unpacked/JaneAIAndroidSource_v57_embedded_model_b.zip -d source
          else
            echo "Package missing."
            ls -la
            exit 1
          fi

      - name: Verify V57 embedded Model B
        working-directory: source
        run: |
          grep -q "v57-embedded-model-b-final" app/src/main/assets/index.html
          grep -q "V57_EMBEDDED_MODEL_B_SHA:c4cb2e997e6575c30b589f120517dedef70ef78fba5da6fc1c55b0761c84027a" app/src/main/assets/index.html
          grep -q "data:model/gltf-binary;base64," app/src/main/assets/index.html
          test "$(find app/src/main/assets -name "*.glb" | wc -l)" -eq 0
          ! grep -R "file:///android_asset/Jane_3D_Mobile_APK_Model_B.glb\|jane_static_model_mobile_small.glb\|Meshy_AI_Kadi\|Meshy_AI_Midnight_Dragon_0512021503_texture.glb" app/src/main

          grep -q "Deathcore101!!" app/src/main/assets/index.html
          grep -q "v56-real-owner-settings-fix" app/src/main/assets/index.html
          grep -q "v56-direct-settings-and-portal-fix" app/src/main/assets/index.html
          test -f "app/src/main/assets/jane_hologram_portal_floor_alpha.gif"
          grep -q "applyV34DialogScrollFix" app/src/main/assets/index.html
          grep -q "JaneReceiveFile" app/src/main/assets/index.html
          grep -q "playAssetVoice" app/src/main/java/com/example/janeai/MainActivity.java

          ! grep -R "BiometricPrompt\|USE_BIOMETRIC\|USE_FINGERPRINT\|runOwnerBiometricCheck\|notifyOwnerCheckResult\|requestOwnerCheck\|Waiting for biometric check" app/src/main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
