name: Build Jane Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jane-android-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and validate V87
        run: bash scripts/build_v87_manual.sh

      - name: Upload signed V87 APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V87-real-ai-rag-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload exact V87 source
        uses: actions/upload-artifact@v4
        with:
          name: JaneAIAndroidSource-v87-real-ai-rag
          path: JaneAIAndroidSource_v87_real_ai_rag.zip
          retention-days: 14
