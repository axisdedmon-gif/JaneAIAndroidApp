name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/trigger-v89-landscape

permissions:
  contents: read

concurrency:
  group: jane-v89-final-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out flattened V89 source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java 21 toolchain
        run: |
          JAVA_SPEC="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')"
          test "$JAVA_SPEC" = "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and validate final V89 APK
        run: bash scripts/build_v89_final.sh

      - name: Upload final versioned V89 APK only
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V89-final-update-safe-apk
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
