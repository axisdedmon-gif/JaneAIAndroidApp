name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack Jane V68B package
        run: |
          rm -rf source unpacked
          mkdir -p unpacked

          if [ -f JaneAIAndroidSource_v68b_vitals_hud_launcher_icon_fixed.zip ]; then
            unzip JaneAIAndroidSource_v68b_vitals_hud_launcher_icon_fixed.zip -d source
          elif [ -f JaneV68BVitalsHudLauncherIconFixedPackage.zip ]; then
            unzip JaneV68BVitalsHudLauncherIconFixedPackage.zip -d unpacked
            unzip unpacked/JaneAIAndroidSource_v68b_vitals_hud_launcher_icon_fixed.zip -d source
          else
            echo "Package missing."
            ls -la
            exit 1
          fi

      - name: Verify V68B
        working-directory: source
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/example/janeai/MainActivity.java

          test -f app/src/main/res/mipmap-mdpi/ic_launcher.webp
          test -f app/src/main/res/mipmap-hdpi/ic_launcher.webp
          test -f app/src/main/res/mipmap-xhdpi/ic_launcher.webp
          test -f app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp

          test -f app/src/main/res/mipmap-mdpi/ic_launcher_round.webp
          test -f app/src/main/res/mipmap-hdpi/ic_launcher_round.webp
          test -f app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp
          test -f app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp

          test -f app/src/main/res/drawable/ic_launcher_foreground.webp

          ! find app/src/main/res -path "*mipmap-*/ic_launcher.png" | grep -q .
          ! find app/src/main/res -path "*mipmap-*/ic_launcher_round.png" | grep -q .
          ! find app/src/main/res -path "*drawable/ic_launcher_foreground.png" | grep -q .

          grep -q "v68-vitals-hud-css" app/src/main/assets/index.html
          grep -q "janeVitalsHUD" app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
