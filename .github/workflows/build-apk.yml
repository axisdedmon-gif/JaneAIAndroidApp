name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack Jane V67 package
        run: |
          rm -rf source unpacked
          mkdir -p unpacked

          if [ -f JaneAIAndroidSource_v67_webp_dialog_portraits.zip ]; then
            unzip JaneAIAndroidSource_v67_webp_dialog_portraits.zip -d source
          elif [ -f JaneV67WebpDialogPortraitsPackage.zip ]; then
            unzip JaneV67WebpDialogPortraitsPackage.zip -d unpacked
            unzip unpacked/JaneAIAndroidSource_v67_webp_dialog_portraits.zip -d source
          else
            echo "Package missing."
            ls -la
            exit 1
          fi

      - name: Verify V67 WebP dialog portraits
        working-directory: source
        run: |
          echo "=== verify source structure ==="
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/example/janeai/MainActivity.java

          echo "=== verify WebP portrait package ==="
          test -f app/src/main/assets/docs/avatar_portrait_paths_webp.json
          test -d app/src/main/assets/dialog_portraits_webp
          find app/src/main/assets/dialog_portraits_webp -name "*.webp" | head -n 1 | grep -q ".webp"
          grep -q "v67-webp-dialog-portrait-router" app/src/main/assets/index.html
          grep -q "JaneWebpPortraitRouter" app/src/main/assets/index.html
          grep -q "docs/avatar_portrait_paths_webp.json" app/src/main/assets/index.html
          grep -q "dialog_portraits_webp" app/src/main/assets/index.html

          echo "=== verify embedded model and retained core features ==="
          grep -q "data:model/gltf-binary;base64," app/src/main/assets/index.html
          grep -q "v58-offline-knowledge-engine" app/src/main/assets/index.html
          grep -q "JaneOfflineKnowledge" app/src/main/assets/index.html
          grep -q "v66-model-up-only-css" app/src/main/assets/index.html
          grep -q "v65-clean-tools-engine" app/src/main/assets/index.html
          grep -q "rotation-per-second" app/src/main/assets/index.html
          grep -q "36deg" app/src/main/assets/index.html
          grep -q "Deathcore101!!" app/src/main/assets/index.html
          grep -q "playAssetVoice" app/src/main/java/com/example/janeai/MainActivity.java

          echo "=== verify broken/dead pieces are gone ==="
          ! grep -R "https://js.puter.com/v2/\|gemini-3.1-flash-lite-preview\|gemini-2.5-flash-image-preview" app/src/main
          ! grep -R "BiometricPrompt\|USE_BIOMETRIC\|USE_FINGERPRINT\|runOwnerBiometricCheck\|notifyOwnerCheckResult\|requestOwnerCheck\|Waiting for biometric check" app/src/main
          ! grep -R "jane_static_model_mobile_small.glb\|Meshy_AI_Kadi\|Meshy_AI_Midnight_Dragon_0512021503_texture.glb" app/src/main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
