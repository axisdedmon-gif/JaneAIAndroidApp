name: Jane APK — Beta Builds
run-name: "Beta 1.0.01 APK · run #${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/beta-apk-build

permissions:
  contents: read

concurrency:
  group: jane-beta-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out Jane source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java 21 toolchain
        run: |
          JAVA_SPEC="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')"
          test "$JAVA_SPEC" = "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and validate Beta 1.0.01 APK
        run: bash scripts/build_beta_apk.sh

      - name: Save Beta 1.0.01 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-Beta-1.0.01-apk
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
