name: Build Jane Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jane-v88-direct-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run update-safe V88 APK build once'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out flattened V88 source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java 21 toolchain
        run: |
          JAVA_SPEC="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')"
          test "$JAVA_SPEC" = "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build versioned update-safe APK
        run: bash scripts/build_v88_direct.sh

      - name: Upload versioned V88 APK only
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V88-update-safe-apk
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
