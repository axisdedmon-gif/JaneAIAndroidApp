name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: jane-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack Jane base package
        run: |
          rm -rf source unpacked
          mkdir -p unpacked

          if [ -f JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip ]; then
            unzip JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip -d source
          elif [ -f JaneV73LaunchRestoredHideVitalsOnlyPackage.zip ]; then
            unzip JaneV73LaunchRestoredHideVitalsOnlyPackage.zip -d unpacked
            unzip unpacked/JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip -d source
          else
            echo "Jane V73 base source package is missing."
            ls -la
            exit 1
          fi

      - name: Apply V76 reply and offline knowledge patch
        run: |
          base64 -d patches/v76.patch.gz.b64 | gzip -d > /tmp/v76.patch
          cd source
          patch -p2 < /tmp/v76.patch

      - name: Apply V77 settings menu and knowledge UI patch
        run: |
          cd source
          patch -p1 < ../patches/v77-settings-menu-knowledge.patch

      - name: Apply V78 Knowledge Base and Archives patch
        run: |
          base64 -d patches/v78.patch.gz.b64 | gzip -d > /tmp/v78.patch
          cd source
          patch -p1 < /tmp/v78.patch

      - name: Enable AndroidX for bundled OCR
        run: |
          touch source/gradle.properties
          grep -q '^android.useAndroidX=' source/gradle.properties \
            || echo 'android.useAndroidX=true' >> source/gradle.properties
          grep -q '^android.enableJetifier=' source/gradle.properties \
            || echo 'android.enableJetifier=true' >> source/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable signing key and configure updates
        env:
          JANE_VERSION_CODE: ${{ github.run_number }}
          JANE_KEYSTORE_PASSWORD: JaneUpdate2026
          JANE_KEY_ALIAS: janeupdate
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/axisdedmon-gif/JaneAIAndroidApp/fbad016ea0d1ceaee341d39d6969484568f8e1dd/signing/jane-update-key.b64 \
            | tr -d '\r\n' \
            | base64 -d > source/app/jane-update-key.jks

          keytool -list \
            -keystore source/app/jane-update-key.jks \
            -storepass "$JANE_KEYSTORE_PASSWORD" \
            -alias "$JANE_KEY_ALIAS" >/dev/null

          cd source
          python3 ../scripts/configure_stable_signing.py

      - name: Verify V78 Knowledge Base Archives and update identity
        working-directory: source
        env:
          JANE_KEYSTORE_PASSWORD: JaneUpdate2026
        run: |
          echo "=== dedicated Knowledge Base and Archives screen ==="
          grep -q "v78-knowledge-base-archives-css" app/src/main/assets/index.html
          grep -q "v78-knowledge-base-archives-engine" app/src/main/assets/index.html
          grep -q "Knowledge Base" app/src/main/assets/index.html
          grep -q "Jane’s learned intelligence and browsable Archives" app/src/main/assets/index.html
          grep -q "v78OpenKnowledgeBaseBtn" app/src/main/assets/index.html
          grep -q "Open Knowledge Base / Archives" app/src/main/assets/index.html
          grep -q "v78ArchiveList" app/src/main/assets/index.html
          grep -q "v78ArchiveReader" app/src/main/assets/index.html
          grep -q "v78ArchiveSearch" app/src/main/assets/index.html
          grep -q "deleteDocument" app/src/main/assets/index.html
          grep -q "getDocument" app/src/main/assets/index.html
          grep -q "listDocuments" app/src/main/assets/index.html

          echo "=== strict knowledge-bounded answers ==="
          grep -q "JANE KNOWLEDGE-BOUND MODE" app/src/main/assets/index.html
          grep -q "only factual knowledge you may use" app/src/main/assets/index.html
          grep -q "I don’t know that from the knowledge you’ve given me" app/src/main/assets/index.html
          grep -q "perform arithmetic or logical deductions" app/src/main/assets/index.html

          echo "=== V77 settings and menu isolation retained ==="
          grep -q "v77-settings-menu-knowledge-fix" app/src/main/assets/index.html
          grep -q "v77-force-closed" app/src/main/assets/index.html
          grep -q "ownerPhraseInput" app/src/main/assets/index.html
          grep -q "Deathcore101!!" app/src/main/assets/index.html
          grep -q "v77ImportKnowledgeBtn" app/src/main/assets/index.html

          echo "=== V76 direct reply and native knowledge extraction retained ==="
          grep -q "v76-dialog-reply-knowledge-css" app/src/main/assets/index.html
          grep -q "dialogReplyComposer" app/src/main/assets/index.html
          grep -q "sendDialogReply" app/src/main/assets/index.html
          grep -q "v76-offline-knowledge-primary-engine" app/src/main/assets/index.html
          grep -q "JaneKnowledgeImportStart" app/src/main/assets/index.html
          grep -q "JaneKnowledgeImportChunk" app/src/main/assets/index.html
          grep -q "JaneKnowledgeImportComplete" app/src/main/assets/index.html
          grep -q "indexedDB.open" app/src/main/assets/index.html
          grep -q "com.google.mlkit:text-recognition:16.0.1" app/build.gradle
          grep -q "PdfRenderer" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "TextRecognition.getClient" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "Intent.EXTRA_ALLOW_MULTIPLE" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "handleKnowledgePickerResult" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "getFileSize" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "fileBytes" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q '^android.useAndroidX=true' gradle.properties

          echo "=== stable in-place update identity ==="
          grep -q 'applicationId = "com.example.janeai"' app/build.gradle
          grep -q 'versionName = "v78.' app/build.gradle
          grep -q "janeStable" app/build.gradle
          grep -q "signingConfig signingConfigs.janeStable" app/build.gradle
          test -f app/jane-update-key.jks
          keytool -list \
            -keystore app/jane-update-key.jks \
            -storepass "$JANE_KEYSTORE_PASSWORD" \
            -alias janeupdate >/dev/null

          echo "=== untouched app systems retained ==="
          grep -q "V75_STARTUP_OBSERVER_FIX" app/src/main/assets/index.html
          grep -q "data:model/gltf-binary;base64," app/src/main/assets/index.html
          grep -q "v70-home-vitals-image3d-css" app/src/main/assets/index.html
          grep -q "v67b-transparent-webp-dialog-portrait-router" app/src/main/assets/index.html
          grep -q "rotation-per-second" app/src/main/assets/index.html
          grep -q "36deg" app/src/main/assets/index.html
          grep -q "playAssetVoice" app/src/main/java/com/example/janeai/MainActivity.java

      - name: Build updateable APK
        working-directory: source
        run: gradle :app:assembleDebug

      - name: Verify APK certificate
        working-directory: source
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk \
            | grep -q "Owner: CN=Jane AI Assistant"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V78-knowledge-base-archives-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
