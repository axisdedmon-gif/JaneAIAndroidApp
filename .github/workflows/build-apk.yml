name: Monolith AI APK — Beta Builds
run-name: "Monolith AI Beta 2.0.04"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monolith-beta-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out Monolith AI source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java 21 toolchain
        run: |
          JAVA_SPEC="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')"
          test "$JAVA_SPEC" = "21"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle 8.7
        run: |
          test "$(gradle --version | sed -n 's/^Gradle //p' | head -n 1)" = "8.7"

      - name: Build and validate Monolith AI Beta 2.0.04 APK
        run: |
          python3 scripts/strip_legacy_scene_overlays.py
          node --check app/src/main/assets/monolith_scene_runtime.js
          node --check app/src/main/assets/monolith_voice_runtime_patch.js
          grep -q 'monolith_scene_runtime.js' app/src/main/assets/monolith_voice_runtime_patch.js
          grep -q 'jane_command_deck.js' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolith-model' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolith-voice' app/src/main/assets/monolith_scene_runtime.js
          grep -q 'monolith-rpg' app/src/main/assets/monolith_scene_runtime.js
          if grep -q 'House Dedmon Access' app/src/main/assets/index.html; then
            echo 'Legacy House Dedmon overlay survived scene cleanup.' >&2
            exit 1
          fi
          if grep -q '"72 BPM"\|"98.6°F"' app/src/main/assets/index.html; then
            echo 'Fake biometric telemetry survived scene cleanup.' >&2
            exit 1
          fi
          bash scripts/build_monolith_apk.sh

      - name: Save Monolith AI Beta 2.0.04 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonolithAI-Beta-2.0.04-apk
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
