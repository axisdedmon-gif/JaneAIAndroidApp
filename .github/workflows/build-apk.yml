name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: jane-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack Jane base package
        run: |
          rm -rf source unpacked
          mkdir -p unpacked

          if [ -f JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip ]; then
            unzip JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip -d source
          elif [ -f JaneV73LaunchRestoredHideVitalsOnlyPackage.zip ]; then
            unzip JaneV73LaunchRestoredHideVitalsOnlyPackage.zip -d unpacked
            unzip unpacked/JaneAIAndroidSource_v73_launch_restored_hide_vitals_only.zip -d source
          else
            echo "Jane V73 base source package is missing."
            ls -la
            exit 1
          fi

      - name: Apply V76 reply and offline knowledge patch
        run: |
          base64 -d patches/v76.patch.gz.b64 | gzip -d > /tmp/v76.patch
          cd source
          patch -p2 < /tmp/v76.patch

      - name: Apply V77 settings menu and knowledge UI patch
        run: |
          cd source
          patch -p1 < ../patches/v77-settings-menu-knowledge.patch

      - name: Apply V78 Knowledge Base patch
        run: |
          base64 -d patches/v78.patch.gz.b64 | gzip -d > /tmp/v78.patch
          cd source
          patch -p1 < /tmp/v78.patch

      - name: Apply V79 native Archives route and UI patch
        run: |
          mkdir -p source/scripts
          cp scripts/configure_stable_signing.py source/scripts/configure_stable_signing.py
          base64 -d patches/v79.patch.gz.b64 | gzip -d > /tmp/v79.patch
          cd source
          patch -p1 < /tmp/v79.patch

      - name: Apply V80 reliable knowledge import and indexing patch
        run: |
          base64 -d patches/v80.patch.gz.b64 | gzip -d > /tmp/v80.patch
          cd source
          patch -p1 < /tmp/v80.patch

      - name: Apply V81 knowledge performance patch preserving imports
        run: |
          base64 -d patches/v81.patch.gz.b64 | gzip -d > /tmp/v81.patch
          cd source
          patch -p1 < /tmp/v81.patch

      - name: Apply V82 offline answer index repair
        run: |
          base64 -d patches/v82.patch.gz.b64 | gzip -d > /tmp/v82.patch
          cd source
          patch -p4 < /tmp/v82.patch

      - name: Apply V83 native offline search and local renderer patch
        run: |
          base64 -d patches/v83.patch.gz.b64 | gzip -d > /tmp/v83.patch
          cd source
          patch -p1 < /tmp/v83.patch

      - name: Bundle model viewer inside the APK
        run: |
          rm -rf /tmp/jane-model-viewer
          mkdir -p /tmp/jane-model-viewer
          cd /tmp/jane-model-viewer
          npm pack @google/model-viewer@4.1.0 --silent
          tar -xzf google-model-viewer-4.1.0.tgz
          cp package/dist/model-viewer-umd.min.js \
            "$GITHUB_WORKSPACE/source/app/src/main/assets/model-viewer-umd.min.js"
          test -s "$GITHUB_WORKSPACE/source/app/src/main/assets/model-viewer-umd.min.js"

      - name: Enable AndroidX for bundled OCR
        run: |
          touch source/gradle.properties
          grep -q '^android.useAndroidX=' source/gradle.properties || echo 'android.useAndroidX=true' >> source/gradle.properties
          grep -q '^android.enableJetifier=' source/gradle.properties || echo 'android.enableJetifier=true' >> source/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable signing key and configure updates
        env:
          JANE_VERSION_CODE: ${{ github.run_number }}
          JANE_KEYSTORE_PASSWORD: JaneUpdate2026
          JANE_KEY_ALIAS: janeupdate
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/axisdedmon-gif/JaneAIAndroidApp/fbad016ea0d1ceaee341d39d6969484568f8e1dd/signing/jane-update-key.b64 \
            | tr -d '\r\n' \
            | base64 -d > source/app/jane-update-key.jks

          keytool -list \
            -keystore source/app/jane-update-key.jks \
            -storepass "$JANE_KEYSTORE_PASSWORD" \
            -alias "$JANE_KEY_ALIAS" >/dev/null

          cd source
          python3 scripts/configure_stable_signing.py

      - name: Verify V83 offline answers local renderer and import preservation
        working-directory: source
        env:
          JANE_KEYSTORE_PASSWORD: JaneUpdate2026
        run: |
          echo "=== V83 native Archive fallback and local answer synthesis ==="
          grep -q "v83-offline-native-search-and-local-model" app/src/main/assets/index.html
          grep -q "JaneNativeKnowledgeSearchResult" app/src/main/assets/index.html
          grep -q "searchKnowledgeArchives" app/src/main/assets/index.html
          grep -q "searchKnowledgeArchives" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "nativeKnowledgeSearch" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "synthesizeLocalAnswer" app/src/main/assets/index.html
          grep -q "navigator.onLine===false" app/src/main/assets/index.html
          grep -q "preservedNativeArchives:true" app/src/main/assets/index.html
          grep -q 'versionName = "v83.' scripts/configure_stable_signing.py
          ! grep -q '^[-+].*deleteKnowledgeArchive' /tmp/v83.patch
          ! grep -q '^[-+].*getKnowledgeArchiveDir' /tmp/v83.patch

          echo "=== model renderer is physically bundled in the APK ==="
          grep -q '<script src="model-viewer-umd.min.js"></script>' app/src/main/assets/index.html
          test -s app/src/main/assets/model-viewer-umd.min.js
          ! grep -q 'unpkg.com/@google/model-viewer' app/src/main/assets/index.html
          grep -q "data:model/gltf-binary;base64," app/src/main/assets/index.html
          grep -q "rotation-per-second" app/src/main/assets/index.html
          grep -q "36deg" app/src/main/assets/index.html

          echo "=== V82 through V76 knowledge systems retained ==="
          grep -q "v82-offline-answer-index-repair" app/src/main/assets/index.html
          grep -q "DB_VERSION=3" app/src/main/assets/index.html
          grep -q "v81-knowledge-performance-preserve-imports" app/src/main/assets/index.html
          grep -q "v80-import-indexing-visibility-fix" app/src/main/assets/index.html
          grep -q "v79-native-archives-route-engine" app/src/main/assets/index.html
          grep -q "v76-offline-knowledge-primary-engine" app/src/main/assets/index.html
          grep -q "knowledge_archive" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "catalog.json" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "copyKnowledgeOriginal" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "writeKnowledgeArchiveText" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "previewKnowledgeArchive" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "com.google.mlkit:text-recognition:16.0.1" app/build.gradle
          grep -q "com.tom-roush:pdfbox-android:2.0.27.0" app/build.gradle
          grep -q '^android.useAndroidX=true' gradle.properties

          echo "=== stable update identity and untouched systems retained ==="
          grep -q 'applicationId = "com.example.janeai"' app/build.gradle
          grep -q 'versionName = "v83.' app/build.gradle
          grep -q "janeStable" app/build.gradle
          grep -q "signingConfig signingConfigs.janeStable" app/build.gradle
          test -f app/jane-update-key.jks
          keytool -list \
            -keystore app/jane-update-key.jks \
            -storepass "$JANE_KEYSTORE_PASSWORD" \
            -alias janeupdate >/dev/null
          grep -q "V75_STARTUP_OBSERVER_FIX" app/src/main/assets/index.html
          grep -q "v70-home-vitals-image3d-css" app/src/main/assets/index.html
          grep -q "v67b-transparent-webp-dialog-portrait-router" app/src/main/assets/index.html
          grep -q "playAssetVoice" app/src/main/java/com/example/janeai/MainActivity.java

      - name: Build updateable APK
        working-directory: source
        run: gradle :app:assembleDebug

      - name: Verify APK certificate
        working-directory: source
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk \
            | grep -q "Owner: CN=Jane AI Assistant"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-V83-offline-core-local-hologram-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
