name: Build Jane Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack Jane V58 package
        run: |
          rm -rf source unpacked
          mkdir -p unpacked

          if [ -f JaneAIAndroidSource_v58_offline_knowledge_engine.zip ]; then
            unzip JaneAIAndroidSource_v58_offline_knowledge_engine.zip -d source
          elif [ -f JaneV58OfflineKnowledgeEnginePackage.zip ]; then
            unzip JaneV58OfflineKnowledgeEnginePackage.zip -d unpacked
            unzip unpacked/JaneAIAndroidSource_v58_offline_knowledge_engine.zip -d source
          else
            echo "Package missing."
            ls -la
            exit 1
          fi

      - name: Verify V58 offline knowledge engine
        working-directory: source
        run: |
          grep -q "v57-embedded-model-b-final" app/src/main/assets/index.html
          grep -q "data:model/gltf-binary;base64," app/src/main/assets/index.html
          grep -q "v58-offline-knowledge-engine" app/src/main/assets/index.html
          grep -q "JaneOfflineKnowledge" app/src/main/assets/index.html
          grep -q "jane_offline_knowledge_v58" app/src/main/assets/index.html
          grep -q "JaneReceiveNativeFile" app/src/main/assets/index.html
          grep -q "pickKnowledgeFile" app/src/main/java/com/example/janeai/MainActivity.java
          grep -q "Deathcore101!!" app/src/main/assets/index.html
          grep -q "applyV34DialogScrollFix" app/src/main/assets/index.html
          grep -q "playAssetVoice" app/src/main/java/com/example/janeai/MainActivity.java
          ! grep -R "BiometricPrompt\|USE_BIOMETRIC\|USE_FINGERPRINT\|runOwnerBiometricCheck\|notifyOwnerCheckResult\|requestOwnerCheck\|Waiting for biometric check" app/src/main
          ! grep -R "jane_static_model_mobile_small.glb\|Meshy_AI_Kadi\|Meshy_AI_Midnight_Dragon_0512021503_texture.glb" app/src/main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaneAI-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
